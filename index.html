
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Realtime Hub</title>
  <style>
    body {
      max-width: 650px;
      margin: 40px auto;
      padding: 16px;
      font-family: system-ui, sans-serif;
      background: #111827;
      color: white;
    }
    #log {
      height: 300px;
      overflow-y: auto;
      padding: 12px;
      background: #1f2937;
      border-radius: 12px;
      overflow-wrap: anywhere;
    }
    input, button {
      box-sizing: border-box;
      padding: 12px;
      border-radius: 8px;
      border: 0;
    }
    input { width: 72%; }
    button { cursor: pointer; }
    #status { color: #93c5fd; }
  </style>
</head>
<body>
  <h1>Realtime Hub</h1>
  <p id="status">接続中...</p>
  <div id="log" aria-live="polite"></div>
  <form id="form">
    <input id="message" maxlength="500"
      placeholder="メッセージを入力" autocomplete="off">
    <button>送信</button>
  </form>

  <script>
    // Renderで発行された自分のURLに置き換える
    const SERVER_URL = "wss://your-app.onrender.com/ws";

    const status = document.querySelector("#status");
    const log = document.querySelector("#log");
    const form = document.querySelector("#form");
    const input = document.querySelector("#message");
    let socket;

    function addMessage(text) {
      const p = document.createElement("p");
      p.textContent = text;
      log.appendChild(p);
      log.scrollTop = log.scrollHeight;
    }

    function connect() {
      socket = new WebSocket(SERVER_URL);

      socket.addEventListener("open", () => {
        status.textContent = "接続済み";
      });

      socket.addEventListener("message", (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.type === "status") {
            status.textContent = data.text;
          }
          if (data.type === "chat") {
            addMessage(data.text);
          }
        } catch {}
      });

      socket.addEventListener("close", () => {
        status.textContent = "切断されました。ページを再読み込みしてね";
      });

      socket.addEventListener("error", () => {
        status.textContent = "接続エラー";
      });
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const text = input.value.trim();

      if (!text || !socket ||
          socket.readyState !== WebSocket.OPEN) {
        return;
      }

      socket.send(JSON.stringify({
        type: "chat",
        text
      }));

      input.value = "";
    });

    connect();
  </script>
</body>
</html>
